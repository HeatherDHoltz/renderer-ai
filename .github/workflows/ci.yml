name: Rust renderer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fetch --locked
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --offline --all-targets -- -D warnings
      - run: cargo +stable test --locked --offline
      - run: cargo +stable build --release --locked --offline
      - name: Validate and render every included example offline
        run: python3 scripts/check_examples.py
